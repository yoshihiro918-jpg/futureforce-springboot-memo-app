<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>管理者登録</title>
    <link href="https://cdn.jsdelivr.net" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f8f9fa;
        }
        .signup-container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
    <div class="signup-container">
        <h1 class="text-center mb-4">ユーザー登録画面</h1>

        <form th:action="@{/admin/signup}" th:object="${admin}" method="post">
            <div class="mb-3">
                <label class="form-label">姓</label>
                <input type="text" th:field="*{lastName}" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">名</label>
                <input type="text" th:field="*{firstName}" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">メールアドレス</label>
                <input type="email" th:field="*{email}" class="form-control" required>
            </div>
            <div class="mb-4">
                <label class="form-label">パスワード</label>
                <input type="password" th:field="*{password}" class="form-control" required>
            </div>
                       
            <div class="text-center">
                <button type="submit" class="btn btn-primary mt-3">登録する</button>
            </div>
        </form>
        
        <div class="text-center">
            <a th:href="@{/admin/signin}" class="btn btn-primary">ログイン画面へ</a>
        </div>
    </div>
</body>
</html>
